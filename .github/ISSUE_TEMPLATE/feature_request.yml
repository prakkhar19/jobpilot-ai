name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance
      options:
        - label: This does not require bypassing CAPTCHAs, logins, rate limits or a site's terms of service.
          required: true
