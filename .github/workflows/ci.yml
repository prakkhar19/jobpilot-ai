name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
          POSTGRES_DB: jobpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobpilot" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests
      - name: Migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://jobpilot:jobpilot@localhost:5432/jobpilot_test
          DATA_DIR: /tmp/jobpilot-ci
          APP_SECRET_KEY: ci-secret-key-0123456789-abcdefghijklmnop
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Install Chromium for browser tests
        run: uv run playwright install --with-deps chromium
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jobpilot:jobpilot@localhost:5432/jobpilot_test
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Tests (SQLite)
        run: uv run pytest -q -m "not browser"

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build + end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env (demo mode, random secrets)
        run: |
          ./scripts/init-env.sh
          sed -i 's/^DEMO_MODE=false/DEMO_MODE=true/' .env
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: End-to-end API workflow (sandbox employer only)
        run: docker compose exec -T backend python - < e2e/api_smoke.py | tee e2e.log
      - name: Persistence across restart
        run: |
          EMAIL=$(grep '^E2E_USER=' e2e.log | cut -d= -f2)
          docker compose down
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T -e E2E_EMAIL="$EMAIL" backend python - < e2e/persistence_check.py
      - name: Frontend served through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<div id=\"root\""
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"ok"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

  security:
    name: Dependency & secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python dependency audit
        run: uvx pip-audit -r backend/requirements.lock --disable-pip --no-deps
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: No committed secrets or personal data
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|\.sqlite3?$|\.db$|\.dump$'
          ! git grep -nE '(sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|nvapi-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})' -- ':!*.md'
